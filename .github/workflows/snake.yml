name: Contribution snake

on:
  schedule:
    - cron: "0 1 * * *"    # every day at 06:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F2B544&color_dots=#2A2344,#5A3552,#8C4863,#C45C74,#E7909A
            dist/snake-light.svg?color_snake=#C45C74&color_dots=#EFE7F0,#F4C6CE,#E7909A,#C45C74,#8C4863

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
